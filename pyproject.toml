# Tooling only (Bandit reads [tool.bandit] here). Not a full PEP 621 package manifest.
[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e", "tests/benchmarks"]
# apps/tui is a standalone package (its own pyproject); make it importable without installing.
pythonpath = ["apps/tui"]
markers = [
    "e2e: HTTP/Playwright end-to-end tests against a running Agent Layer instance",
    "benchmark: live LLM provider/model benchmarks (requires running server, real models)",
]

# Coverage. Measured in-process only: the backend served by Docker is a separate
# process, so HTTP e2e tests contribute nothing here and the persistence layer
# reads far lower than it actually runs. In-container instrumentation
# (COVERAGE_PROCESS_START + sitecustomize, merging .coverage.*) is the only way
# to close that gap.
#
# The seed scripts are listed explicitly because tests load them by file path, not
# as an installed package, and they were previously covered by nothing but a live run.
[tool.coverage.run]
branch = true
source = ["apps/backend"]
omit = [
    "*/migrations/*",
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
# Floor as of 2026-09-21: 44.4% with branch coverage enabled (tests/unit +
# tests/benchmarks). Statements-only reads higher (~48.5%), so a threshold taken
# from the statements figure fails once branch=True is on — this number is the
# combined measure. Ratchet upward as coverage lands. This is deliberately below
# the 80% target, not a substitute for it: 80% is unreachable while the DB and
# integration layers can only be exercised through the container.
fail_under = 44
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

