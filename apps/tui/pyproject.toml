[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlayer-tui"
version = "0.1.0"
description = "Terminal client for AgentLayer"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
agentlayer = "agentlayer_tui.cli:main"

[tool.setuptools.packages.find]
include = ["agentlayer_tui*"]
