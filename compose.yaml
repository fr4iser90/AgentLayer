# Agent layer + PostgreSQL. Netzwerk ai-net (wie examples/ollama/docker/compose.yaml).
#
# Variablen: docker/.env (von .env_example kopieren). Compose lädt .env automatisch.
#
# Start:
#   docker compose up -d
#
# Open WebUI: OpenAI API URL → http://agent-layer:8080/v1 (im gleichen Docker-Netz)
#   oder vom Host: http://HOST_IP:8088/v1
#
# Modell mit Tool Calling (z. B. llama3.1, qwen2.5).
services:
  # NOTE: Internal Docker networking only. Use HTTPS/proxy for external access.
  postgres:
    # pgvector extension required for RAG (migration 6). Existing volumes: backup before switching image if needed.
    image: pgvector/pgvector:pg16
    container_name: agent-layer-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: ${POSTGRES_MEM_LIMIT:-1G}
        reservations:
          memory: ${POSTGRES_MEM_RESERVE:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s
  # NOTE: Internal Docker networking only. Use HTTPS/proxy for external access.
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: agent-layer-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - agent_qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      # Quieter logs after a one-time volume reset (old WAL replays dim-mismatch as ERROR on boot).
      - QDRANT__LOG_LEVEL=ERROR
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPU_LIMIT:-1.0}"
          memory: ${QDRANT_MEM_LIMIT:-768M}
        reservations:
          memory: ${QDRANT_MEM_RESERVE:-256M}
  neo4j:
    image: neo4j:5-community
    container_name: agent-layer-neo4j
    restart: unless-stopped
    environment:
      # Do not mount the full .env here — Neo4j maps every NEO4J_* var to server config
      # (e.g. NEO4J_URL / NEO4J_PASSWORD from agent-layer would break startup).
      # NEO4J_AUTH applies only on first boot (empty agent_neo4j_data volume).
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
      # Cap heap/pagecache so Neo4j does not eat the host (keep under NEO4J_MEM_LIMIT).
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-1G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512m}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - agent_neo4j_data:/data
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          cpus: "${NEO4J_CPU_LIMIT:-1.5}"
          memory: ${NEO4J_MEM_LIMIT:-2G}
        reservations:
          memory: ${NEO4J_MEM_RESERVE:-512M}
    healthcheck:
      # Password comes from NEO4J_AUTH (neo4j/<password>); do not set NEO4J_PASSWORD in this service.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  # NOTE: Internal Docker networking only. Use HTTPS/proxy for external access.
  agent-layer:
    build:
      context: .
      dockerfile: Dockerfile
    image: jetpack-agent-layer:local
    container_name: agent-layer
    # Optional: restart unless-stopped after first admin exists (via /app/setup or AGENT_INITIAL_ADMIN_*).
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    ports:
      - "${AGENT_HTTP_PORT:-8088}:8080"
    env_file:
      - .env
    environment:
      # DB-backed project workspaces (manual/git/agentlayer-self). Separate from /workspace/AgentLayer (read-only seed).
      # See docs/runbooks/workspace-persistence.md
      # LSP servers are not in the image — put them on PATH or set AGENT_LSP_*_CMD (docs/runbooks/lsp.md).
      # Shared Chromium cache for all coding workspaces (Playwright) — docs/runbooks/playwright.md
      PLAYWRIGHT_BROWSERS_PATH: /data/ms-playwright
      AGENTLAYER_WORKSPACE_PATH: /data/project_workspaces
    volumes:
      - ./plugins/tools/agent_created:/data/tools:rw
      - .:/code:ro
      - .:/workspace/AgentLayer:ro
      - ./workspace:/data/project_workspaces:rw
      - agent_ms_playwright:/data/ms-playwright:rw
    # Chromium needs shared memory; Docker default 64MB → flaky Playwright. Override via AGENT_SHM_SIZE.
    shm_size: ${AGENT_SHM_SIZE:-512mb}
    # Budget for API + coding bash + 1× Playwright + 1–3 small apps/scripts (tune via .env).
    # Peak stack ≈ agent 6G + neo4j 2G + postgres 1G + qdrant 768M ≈ 10G — leave host headroom.
    deploy:
      resources:
        limits:
          cpus: "${AGENT_CPU_LIMIT:-3.0}"
          memory: ${AGENT_MEM_LIMIT:-6G}
        reservations:
          cpus: "${AGENT_CPU_RESERVE:-1.0}"
          memory: ${AGENT_MEM_RESERVE:-2G}
    # Optional read-only:  - ./plugins/tools/agent_created:/data/tools:ro
    # Optional: mount dirs for fs_* if you need host files in-container (paths are cwd/absolute; no AGENT_DASHBOARD_ROOT).
    networks:
      - ai-net
volumes:
  agent_pg_data:
  agent_qdrant_data:
  agent_neo4j_data:
  agent_ms_playwright:
networks:
  ai-net:
    external: true
