# Agent tuning knob registry (v2 — planning complete)
# Index: docs/benchmarks/PLANNING.md
#
# POLICY — runtime via WebUI/API, NOT .env:
#   layer runtime_config knobs = FULL runtime settings (Admin Agent Tuning tab).
#   apply_via: agent-config/apply → DB (agent_config_overrides).
#   bootstrap_env_key = legacy name in config.py TODAY only; target: code reads DB first,
#     env var optional empty on new installs — operators never edit .env for these.
#   After migration: unset AGENT_* in .env is fine; WebUI/Operator owns the value.

version: 2

ui_groups:
  - id: agent_limits
    label: Agent loop limits
  - id: context_harness
    label: Context harness (compaction, budgets)
  - id: loop_guards
    label: Tool loop guards (thrash / doom-loop)
  - id: delegate
    label: Delegate and sub-agents
  - id: tool_routing
    label: Tool routing and filtering
  - id: tool_forward
    label: Tool forward, ranking, schema
  - id: model_routing
    label: Model profiles and overrides
  - id: smart_route
    label: LLM smart routing (chat)
  - id: agents
    label: Agent registry and prompts
  - id: routers
    label: Delegate / task / catalog routers
  - id: rubrics
    label: Benchmark rubrics and scenarios
  - id: bench_harness
    label: Benchmark harness options
  - id: observability
    label: Logging and diagnostics

knobs:
  # --- agent_limits (runtime_config → DB via agent-config/apply) ---
  - id: agent.max_tool_rounds
    layer: runtime_config
    bootstrap_env_key: AGENT_MAX_TOOL_ROUNDS
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/maxToolRounds
    default: 20
    ui_group: agent_limits
    affects_agents: [general, coding, math, dashboard, security_auditor]
    affects_clusters: [S, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: Max LLM-tool rounds per chat turn. Tuning = API only; bootstrap_env_key not edited.

  - id: agent.subagent_max_tool_rounds
    layer: runtime_config
    bootstrap_env_key: SUBAGENT_MAX_TOOL_ROUNDS
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/subagentMaxToolRounds
    ui_group: agent_limits
    affects_agents: [general]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Max tool rounds for delegate sub-agents only.

  - id: agent.subagent_timeout_sec
    layer: runtime_config
    bootstrap_env_key: SUBAGENT_TIMEOUT_SEC
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/subagentTimeoutSec
    ui_group: agent_limits
    affects_agents: [general]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: Sub-agent wall-clock timeout; null = unlimited.

  # --- context_harness ---
  - id: context.compaction_enabled
    layer: runtime_config
    bootstrap_env_key: CHAT_CONTEXT_COMPACTION_ENABLED
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/booleanConfig
    default: true
    ui_group: context_harness
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: LLM summarization of older chat history when approaching context soft limit.

  - id: context.agent_loop_trim_enabled
    layer: runtime_config
    bootstrap_env_key: CHAT_CONTEXT_AGENT_LOOP_TRIM_ENABLED
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/booleanConfig
    default: true
    ui_group: context_harness
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: Mid-run compaction of older tool rounds when provider prompt_tokens exceed soft ratio.

  - id: context.keep_recent_tool_rounds
    layer: runtime_config
    bootstrap_env_key: CHAT_CONTEXT_KEEP_RECENT_TOOL_ROUNDS
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/keepRecentToolRounds
    default: 6
    ui_group: context_harness
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: Tool-round groups kept verbatim during loop compaction; halved at hard limit.

  - id: context.tools_budget_ratio
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOLS_BUDGET_RATIO
    type: number
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/toolsBudgetRatio
    default: 0.06
    ui_group: context_harness
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: Fraction of model context window reserved for tool schemas per LLM call.

  - id: context.tool_result_max_ratio
    layer: runtime_config
    bootstrap_env_key: CHAT_CONTEXT_TOOL_RESULT_MAX_RATIO
    type: number
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/toolResultMaxRatio
    default: 0.008
    ui_group: context_harness
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: Max chars per tool result message as fraction of context window.

  # --- loop_guards ---
  - id: agent.tool_thrash_enabled
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOL_THRASH_ENABLED
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/booleanConfig
    default: false
    ui_group: loop_guards
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Detect repeated identical tool calls and inject recovery hint.

  - id: agent.tool_thrash_streak_max
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOL_THRASH_STREAK_MAX
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/loopGuardStreakMax
    default: 10
    ui_group: loop_guards
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Identical tool-call streak before thrash guard fires.

  - id: agent.doom_loop_enabled
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOL_DOOM_LOOP_ENABLED
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/booleanConfig
    default: false
    ui_group: loop_guards
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Detect alternating tool-call patterns (doom loop) and inject recovery hint.

  - id: agent.doom_loop_streak_max
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOL_DOOM_LOOP_STREAK_MAX
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/loopGuardStreakMax
    default: 10
    ui_group: loop_guards
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Alternating-pattern streak before doom-loop guard fires.

  # --- tool_routing ---
  - id: tool_routing.domain_order
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOL_DOMAIN_ORDER
    type: string_list
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/toolDomainOrder
    ui_group: tool_routing
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: TOOL_DOMAIN priority order when classifying user text.

  - id: tool_routing.router_strict_default
    layer: runtime_config
    bootstrap_env_key: AGENT_ROUTER_STRICT_DEFAULT
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/routerStrictDefault
    default: true
    ui_group: tool_routing
    affects_agents: [general]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Strict category filter default.

  - id: tool_routing.classify_categories
    layer: code
    path: apps/backend/domain/plugin_system/tool_routing.py
    type: fingerprint
    writable: false
    apply_via: none
    value_schema: read-only-fingerprint.json
    ui_group: tool_routing
    affects_agents: [general]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Built-in TOOL_TRIGGERS fingerprint — use tool_routing.trigger_overlay to tune phrases via Harness.

  - id: tool_routing.trigger_overlay
    layer: runtime_config
    type: json
    writable: true
    apply_via: agent-config/apply
    value_schema: trigger-overlay.json
    ui_group: tool_routing
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: "Per-category trigger phrase additions merged into router TOOL_TRIGGERS (e.g. {\"github\": [\"open pr\"]})."

  - id: planner.tool_merge
    layer: code
    path: apps/backend/domain/agent_planner.py
    type: fingerprint
    writable: false
    apply_via: none
    value_schema: read-only-fingerprint.json
    ui_group: tool_routing
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Tool merge, routing, forward policy in planner loop.

  # --- tool_forward ---
  - id: tool_forward.ranking_enabled
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOLS_RANKING_ENABLED
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/toolsRankingEnabled
    default: true
    ui_group: tool_forward
    affects_agents: [general]
    affects_clusters: [S, S4, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Rank and prune forwarded tools per LLM round.

  - id: tool_forward.full_schema
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOLS_FULL_SCHEMA
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/toolsFullSchema
    default: false
    ui_group: tool_forward
    affects_agents: [general, coding]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Send full JSON schema for forwarded tools to LLM.

  - id: tool_forward.catalog_after_first_round
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOLS_CATALOG_AFTER_FIRST_ROUND
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/catalogAfterFirstRound
    default: true
    ui_group: tool_forward
    affects_agents: [general]
    affects_clusters: [S]
    benchmark_sensitive: true
    doc: Promote catalog tools after first LLM round.

  - id: agent.tool_choice_required_retry
    layer: runtime_config
    bootstrap_env_key: AGENT_TOOL_CHOICE_REQUIRED_RETRY
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/toolChoiceRequiredRetry
    default: true
    ui_group: tool_forward
    affects_agents: [general]
    affects_clusters: [S, S4, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Retry when tool call was required but missing.

  - id: tool_forward.policy
    layer: code
    path: apps/backend/domain/tool_forward_policy.py
    type: fingerprint
    writable: false
    apply_via: none
    value_schema: read-only-fingerprint.json
    ui_group: tool_forward
    affects_agents: [general]
    affects_clusters: [S, S4, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Pinning, ranking, delegate preservation logic.

  # --- agents ---
  - id: agent.general.pinned_tools
    layer: agent_yaml
    path: plugins/agents/general/agent.yaml
    field: pinned_tools
    type: string_list
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/generalPinnedToolsDefault
    ui_group: agents
    affects_agents: [general]
    affects_clusters: [S, S4, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: Tools always forwarded for General orchestrator.

  - id: agent.general.system_prompt
    layer: agent_yaml
    path: plugins/agents/general/system_prompt.md
    field: system_prompt
    type: string
    format: markdown
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/systemPromptMarkdown
    ui_group: agents
    affects_agents: [general]
    affects_clusters: [S, S4, C, W, D, SEC, SOC]
    benchmark_sensitive: true
    doc: General orchestrator system prompt body.

  - id: operator.delegate_enabled
    layer: operator
    operator_settings_key: delegate_enabled
    type: boolean
    writable: true
    apply_via: operator-settings
    value_schema: operator-tuning-fields.json#/$defs/delegateEnabled
    default: true
    ui_group: delegate
    affects_agents: [general]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: Master kill-switch for delegate tool (ADR 0007).

  - id: agent.coding.system_prompt
    layer: agent_yaml
    path: plugins/agents/coding/system_prompt.md
    field: system_prompt
    type: string
    format: markdown
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/systemPromptMarkdown
    ui_group: agents
    affects_agents: [coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: Coding specialist system prompt body.

  - id: agent.coding.pinned_tools
    layer: agent_yaml
    path: plugins/agents/coding/agent.yaml
    field: pinned_tools
    type: string_list
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/pinnedTools
    ui_group: agents
    affects_agents: [coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: Tools always forwarded for Coding agent every round.

  - id: agent.coding.tool_allowlist
    layer: agent_yaml
    path: plugins/agents/coding/agent.yaml
    field: tool_allowlist
    type: string_list
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/pinnedTools
    ui_group: agents
    affects_agents: [coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: Coding agent tool allowlist preset (full list replaces file default when set in DB).

  - id: agent.coding.tool_discipline_preset
    layer: agent_yaml
    path: plugins/agents/coding/agent.yaml
    field: tool_discipline_preset
    type: string
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/codingToolDisciplinePreset
    ui_group: agents
    affects_agents: [coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: Turn-hook preset (coding_build vs coding_plan).

  - id: agent.coding.coding_tools_permission_ask
    layer: agent_yaml
    path: plugins/agents/coding/agent.yaml
    field: coding_tools_permission_ask
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/booleanConfig
    default: false
    ui_group: agents
    affects_agents: [coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: "true = ask user before destructive coding tools; false = unattended benchmark/chat parity."

  # --- delegate ---
  - id: delegate.allowed_agent_ids
    layer: runtime_config
    type: string_list
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/delegateAllowedAgentIds
    ui_group: delegate
    affects_agents: [general]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: When set, intersect registry delegatable agents with this allowlist.

  - id: delegate.allowed_modes
    layer: runtime_config
    type: string_list
    writable: true
    apply_via: agent-config/apply
    value_schema: agent-yaml-fields.json#/$defs/delegateAllowedModes
    ui_group: delegate
    affects_agents: [general, coding]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: "Allowed delegate modes (git_forensics, fix_from_artifact, security_dashboard_sync). Empty = all."

  - id: delegate.max_artifact_refs
    layer: runtime_config
    type: integer
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/delegateMaxArtifactRefs
    default: 8
    ui_group: delegate
    affects_agents: [general, coding]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: Max artifact refs scanned for fix_from_artifact path allowlist.

  - id: delegate.infer_git_forensics
    layer: runtime_config
    type: boolean
    writable: true
    apply_via: agent-config/apply
    value_schema: runtime-config-values.json#/$defs/booleanConfig
    default: true
    ui_group: delegate
    affects_agents: [general]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: Auto-infer git_forensics delegate mode from prompt signals when mode not explicit.

  # --- routers ---
  - id: router.delegate
    layer: router_yaml
    path: plugins/tools/platform/agents/delegate.router.yaml
    type: json
    writable: true
    apply_via: agent-config/apply
    value_schema: router-overlay.json
    ui_group: routers
    affects_agents: [general]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: Delegate router locale phrases + domain.

  - id: router.catalog
    layer: router_yaml
    path: plugins/tools/platform/agents/catalog.router.yaml
    type: json
    writable: true
    apply_via: agent-config/apply
    value_schema: router-overlay.json
    ui_group: routers
    affects_agents: [general]
    affects_clusters: [S]
    benchmark_sensitive: true
    doc: Catalog tool router phrases (S1).

  - id: router.task
    layer: router_yaml
    path: plugins/tools/platform/agents/task.router.yaml
    type: json
    writable: true
    apply_via: agent-config/apply
    value_schema: router-overlay.json
    ui_group: routers
    affects_agents: [general]
    affects_clusters: [S, C]
    benchmark_sensitive: true
    doc: Task delegation router phrases.

  - id: router.github
    layer: router_yaml
    path: plugins/tools/integrations/github/git_read.router.yaml
    type: json
    writable: true
    apply_via: agent-config/apply
    value_schema: router-overlay.json
    ui_group: routers
    affects_agents: [general, coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: GitHub/git router phrase overlay (domain github).

  - id: router.workspace
    layer: router_yaml
    path: plugins/tools/workspace/bind/workspaces.router.yaml
    type: json
    writable: true
    apply_via: agent-config/apply
    value_schema: router-overlay.json
    ui_group: routers
    affects_agents: [general, coding]
    affects_clusters: [C, W]
    benchmark_sensitive: true
    doc: Workspace bind/create router phrase overlay.

  # --- model_routing ---
  - id: model.resolve_effective
    layer: code
    path: apps/backend/domain/model_routing.py
    type: fingerprint
    writable: false
    apply_via: none
    value_schema: read-only-fingerprint.json
    ui_group: model_routing
    affects_agents: [general, coding, math]
    affects_clusters: [S4, C, W, SEC]
    benchmark_sensitive: true
    doc: Subagent model inheritance — code + agent model_profile yaml.

  # --- smart_route (operator — live today) ---
  - id: operator.llm_smart_routing_enabled
    layer: operator
    operator_settings_key: llm_smart_routing_enabled
    type: boolean
    writable: true
    apply_via: operator-settings
    value_schema: operator-tuning-fields.json#/$defs/llmSmartRoutingEnabled
    ui_group: smart_route
    benchmark_sensitive: false
    doc: Chat smart routing; benchmarks use explicit model on profile.

  # --- rubrics (read-only fingerprints — grading code, not harness tuning) ---
  - id: rubric.s1_tool_catalog
    layer: rubric
    admin_ui: false
    path: tests/benchmarks/agent/rubrics.py
    type: fingerprint
    writable: false
    apply_via: none
    value_schema: read-only-fingerprint.json
    ui_group: rubrics
    affects_agents: [general]
    affects_clusters: [S]
    benchmark_sensitive: true
    doc: S1 pass — catalog call + three agent_id names in reply.

  - id: rubric.s4_delegate_math
    layer: rubric
    admin_ui: false
    path: tests/benchmarks/agent/rubrics.py
    type: fingerprint
    writable: false
    apply_via: none
    value_schema: read-only-fingerprint.json
    ui_group: rubrics
    affects_agents: [general, math]
    affects_clusters: [S4]
    benchmark_sensitive: true
    doc: S4 pass — delegate + answer contains 42.

  # --- bench_harness (per-run overrides on benchmarks/runs — not agent-config / Harness page) ---
  - id: bench.scenario_timeout_sec
    layer: bench
    admin_ui: false
    bench_field: scenario_timeout_sec
    type: number
    writable: false
    apply_via: benchmarks/runs
    value_schema: bench-harness.json#/$defs/scenarioTimeoutSec
    ui_group: bench_harness
    affects_clusters: [S, C, W, D, SEC, SOC, INT]
    benchmark_sensitive: true
    doc: Per-scenario timeout on benchmark run.

  - id: bench.max_tool_rounds_override
    layer: bench
    admin_ui: false
    bench_field: max_tool_rounds_override
    type: integer
    writable: false
    apply_via: benchmarks/runs
    value_schema: bench-harness.json#/$defs/maxToolRoundsOverride
    ui_group: bench_harness
    affects_agents: [general]
    affects_clusters: [S, C, W, D, SEC]
    benchmark_sensitive: true
    doc: Benchmark-only max_tool_rounds override.

  - id: bench.capture_timeline
    layer: bench
    admin_ui: false
    bench_field: capture_timeline
    type: boolean
    writable: false
    apply_via: benchmarks/runs
    value_schema: bench-harness.json#/$defs/benchCaptureTimeline
    default: true
    ui_group: bench_harness
    affects_clusters: [S, C, W, D, SEC, SOC, INT]
    benchmark_sensitive: true
    doc: WebSocket timeline capture vs HTTP-only (harness preset / run body).

  - id: bench.harness_preset
    layer: bench
    admin_ui: false
    bench_field: harness_preset
    type: string
    writable: false
    apply_via: benchmarks/runs
    value_schema: bench-harness.json#/$defs/harnessPreset
    default: observability
    ui_group: bench_harness
    affects_clusters: [S, C, W, D, SEC, SOC, INT]
    benchmark_sensitive: true
    doc: observability | chat_parity — must not mix in same cohort.

layer_enum:
  - runtime_config
  - operator
  - agent_yaml
  - router_yaml
  - bench
  - rubric
  - code

apply_via_enum:
  - agent-config/apply
  - operator-settings
  - benchmarks/runs
  - none

type_enum:
  - boolean
  - integer
  - number
  - string
  - string_list
  - json
  - fingerprint

effective_value_order:
  - bench_run_override
  - model_db_override
  - provider_db_override
  - db_override
  - registry_default
  - file_default
  - bootstrap_env_key

tuning_forbidden:
